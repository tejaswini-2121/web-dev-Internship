<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery</title>
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      background:black;
      padding: 20px;
      color: white;
      text-align:left;
    }

    .gallery {
      display:flex;
      gap: 150px;
      align-items:flex-end;
      flex-wrap:wrap;
      justify-content:center;
      justify-content: space-evenly;
    }

    .gallery img {
      width: 200px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.6s ease;
      align-items: center;
    }

    .gallery img:hover {
      transform: scale(1.8);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
    }

    .modal:target {
      display: block;
    }

    .modal-content {
      margin: auto;
      margin-top: 100px;
      display: block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      
      
    }

    .close {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 40px;
      text-decoration: none;
      color: white;
    }
  </style>
</head>
<body>

<h2>Click on any image to view it in large size</h2>

<div class="gallery">
  <a href="#img1"><img src="images/forest.webp" alt="forest"></a>
  <a href="#img2"><img src="images/Natures.avif" alt="Natures"></a>
  <a href="#img3"><img src="images/sunny beach.webp" alt="sunny beach"></a>
</div>

<!-- Modals -->
<div id="img1" class="modal">
  <a href="#" class="close">&times;</a>
  <img src="images/forest.webp" class="modal-content" alt="forest">
</div>

<div id="img2" class="modal">
  <a href="#" class="close">&times;</a>
  <img src="images/Natures.avif" class="modal-content" alt="Natures">
</div>

<div id="img3" class="modal">
  <a href="#" class="close">&times;</a>
  <img src="images/sunny beach.webp" class="modal-content" alt="sunny beach">
</div>

</body>
</html>
