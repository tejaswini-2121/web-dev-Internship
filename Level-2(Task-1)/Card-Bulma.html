<!DOCTYPE html>
<html>
<head>
  <title>Bulma Card</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>
  <section class="section has-background-light py-6">
    <div class="container is-flex is-justify-content-center">

      <div class="card" style="max-width: 400px; margin: auto;">
        <div class="card-image">
          <figure class="image is-4by3">
            <img src="images/Natures.avif" alt="Placeholder image">
          </figure>
        </div>
        <div class="card-content">
          <div class="media">
            <div class="media-content">
              <p class="title is-4">Nature Card</p>
            </div>
          </div>
          <div class="content">
            Nature is the art of God — from towering mountains to flowing rivers, it surrounds us with peace, balance, and beauty. It reminds us to breathe deeply, live simply, and appreciate the wonders of the world..
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
