<!DOCTYPE html>
<html>
<head>
  <title>Responsive Cards Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
  <h2 class="text-center mb-4">Explore Nature</h2>

  <div class="row">
    <!-- Card 1 -->
    <div class="col-12 col-md-4 mb-4">
      <div class="card h-100">
        <img src="images/forest.webp" class="card-img-top img-fluid" alt="Forest">
        <div class="card-body">
          <h5 class="card-title">Peaceful Forest</h5>
          <p class="card-text">Experience the calming vibes of deep green woods and chirping birds.</p>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="col-12 col-md-4 mb-4">
      <div class="card h-100">
        <img src="images/misty mountain.avif" class="card-img-top img-fluid" alt="Mountains">
        <div class="card-body">
          <h5 class="card-title">Misty Mountains</h5>
          <p class="card-text">Hike through the mist and feel the power of towering peaks.</p>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="col-12 col-md-4 mb-4">
      <div class="card h-100">
        <img src="images/sunny beach.webp" class="card-img-top img-fluid" alt="Beach">
        <div class="card-body">
          <h5 class="card-title">Sunny Beaches</h5>
          <p class="card-text">Walk the shoreline, feel the waves, and relax under the sun.</p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
